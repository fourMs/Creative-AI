<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Five stacked layers from data at the bottom to culture at the top, each with the question it answers">
  <style>
    .layer { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 10; ry: 10; }
    .top { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 10; ry: 10; }
    .label { font: 700 15px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 13px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .axis { fill: none; stroke: #8a8598; stroke-width: 2; marker-end: url(#a3); }
  
    @media (prefers-color-scheme: dark) {
      .bg { fill: #e7e5e4; }
      .bg.head { fill: #d8b4fe; }
      .axis { stroke: #a8a29e; }
    }
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8598"/>
    </marker>
  </defs>

  <text class="head bg" x="120" y="34">A claim is easier to judge once you know which layer it is about</text>

  <rect class="top" x="120" y="52" width="620" height="46"/>
  <text class="label" x="150" y="81">Culture</text>
  <text class="small" x="290" y="81">what changes when the work reaches the world</text>

  <rect class="layer" x="120" y="106" width="620" height="46"/>
  <text class="label" x="150" y="135">Practice</text>
  <text class="small" x="290" y="135">how somebody makes good work with it</text>

  <rect class="layer" x="120" y="160" width="620" height="46"/>
  <text class="label" x="150" y="189">Interface</text>
  <text class="small" x="290" y="189">how it is steered</text>

  <rect class="layer" x="120" y="214" width="620" height="46"/>
  <text class="label" x="150" y="243">Model</text>
  <text class="small" x="290" y="243">what the system can do, and why</text>

  <rect class="layer" x="120" y="268" width="620" height="46"/>
  <text class="label" x="150" y="297">Data</text>
  <text class="small" x="290" y="297">what went into it, from whom, with what consent</text>

  <path class="axis" d="M 90 300 L 90 60"/>
  <text class="small bg" x="76" y="200" text-anchor="middle" transform="rotate(-90 76 200)">from the material to the world</text>
</svg>

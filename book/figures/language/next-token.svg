<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="A prompt split into tokens, a probability distribution over the next token, and the chosen token appended to the prompt">
  <style>
    .tok { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 8; ry: 8; }
    .slot { fill: none; stroke: #5a2a7a; stroke-width: 2; stroke-dasharray: 5 4; rx: 8; ry: 8; }
    .bar { fill: #5a2a7a; }
    .bar-hi { fill: #e8556d; }
    .label { font: 600 14px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .arrow { fill: none; stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
    .back { fill: none; stroke: #e8556d; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#a2); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8556d"/>
    </marker>
  </defs>

  <text class="head" x="40" y="34">The prompt, split into tokens</text>
  <rect class="tok" x="40"  y="52" width="66" height="40"/>
  <text class="label" x="73"  y="78" text-anchor="middle">The</text>
  <rect class="tok" x="116" y="52" width="86" height="40"/>
  <text class="label" x="159" y="78" text-anchor="middle">capital</text>
  <rect class="tok" x="212" y="52" width="46" height="40"/>
  <text class="label" x="235" y="78" text-anchor="middle">of</text>
  <rect class="tok" x="268" y="52" width="70" height="40"/>
  <text class="label" x="303" y="78" text-anchor="middle">Nor</text>
  <rect class="tok" x="348" y="52" width="70" height="40"/>
  <text class="label" x="383" y="78" text-anchor="middle">way</text>
  <rect class="tok" x="428" y="52" width="46" height="40"/>
  <text class="label" x="451" y="78" text-anchor="middle">is</text>
  <rect class="slot" x="484" y="52" width="60" height="40"/>
  <text class="small" x="514" y="78" text-anchor="middle">next</text>

  <path class="arrow" d="M 544 72 L 610 72"/>
  <text class="small" x="700" y="66" text-anchor="middle">a probability for</text>
  <text class="small" x="700" y="84" text-anchor="middle">every token</text>

  <text class="head" x="40" y="146">The distribution over the next token</text>
  <rect class="bar-hi" x="40"  y="160" width="300" height="26"/>
  <text class="label" x="356" y="179">Oslo</text>
  <rect class="bar" x="40" y="196" width="90" height="26"/>
  <text class="label" x="146" y="215">Bergen</text>
  <rect class="bar" x="40" y="232" width="40" height="26"/>
  <text class="label" x="96" y="251">a</text>
  <rect class="bar" x="40" y="268" width="8" height="26"/>
  <text class="label" x="64" y="287">purple</text>

  <path class="back" d="M 400 180 L 600 180 L 600 300 L 514 300 L 514 100"/>
  <text class="small" x="690" y="240" fill="#e8556d">the chosen token is</text>
  <text class="small" x="690" y="258" fill="#e8556d">appended, and the</text>
  <text class="small" x="690" y="276" fill="#e8556d">model runs again</text>
</svg>

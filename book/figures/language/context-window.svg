<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="A context window holding system instructions and recent turns, with earlier turns falling outside it">
  <style>
    .win { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2.5; rx: 14; ry: 14; }
    .turn { fill: #fff; stroke: #5a2a7a; stroke-width: 1.5; rx: 8; ry: 8; }
    .gone { fill: #f2f2f4; stroke: #b9b4c4; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 8; ry: 8; }
    .out { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 10; ry: 10; }
    .label { font: 600 13px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .faint { font: 600 13px Helvetica, Arial, sans-serif; fill: #8a8598; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .arrow { fill: none; stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
  </defs>

  <text class="faint" x="40" y="34">Outside the window</text>
  <rect class="gone" x="40" y="46" width="150" height="34"/>
  <text class="faint" x="115" y="68" text-anchor="middle">earlier turn</text>
  <rect class="gone" x="40" y="90" width="150" height="34"/>
  <text class="faint" x="115" y="112" text-anchor="middle">earlier turn</text>
  <text class="small" x="115" y="146" text-anchor="middle" style="fill:#8a8598">not forgotten:</text>
  <text class="small" x="115" y="164" text-anchor="middle" style="fill:#8a8598">never there</text>

  <text class="head" x="230" y="34">The context window</text>
  <rect class="win" x="230" y="46" width="330" height="230"/>
  <rect class="turn" x="250" y="66" width="290" height="34"/>
  <text class="label" x="395" y="88" text-anchor="middle">system instructions</text>
  <rect class="turn" x="250" y="110" width="290" height="34"/>
  <text class="label" x="395" y="132" text-anchor="middle">your message</text>
  <rect class="turn" x="250" y="154" width="290" height="34"/>
  <text class="label" x="395" y="176" text-anchor="middle">the model's reply</text>
  <rect class="turn" x="250" y="198" width="290" height="34"/>
  <text class="label" x="395" y="220" text-anchor="middle">your message</text>
  <text class="small" x="395" y="256" text-anchor="middle">read from the start for every reply</text>

  <rect class="out" x="610" y="130" width="150" height="60"/>
  <text class="label" x="685" y="166" text-anchor="middle">next reply</text>
  <path class="arrow" d="M 560 160 L 610 160"/>
  <text class="small" x="400" y="304" text-anchor="middle">An instruction that matters is restated near the end, where it competes with less.</text>
</svg>

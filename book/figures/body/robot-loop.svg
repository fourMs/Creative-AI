<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Sense, decide, act loop of a musicking robot, closed through a human player and the room">
  <style>
    .box { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 12; ry: 12; }
    .human { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 12; ry: 12; }
    .label { font: 600 15px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 13px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .arrow { fill: none; stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
    .sound { fill: none; stroke: #e8556d; stroke-width: 2; marker-end: url(#a2); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8556d"/>
    </marker>
  </defs>

  <text class="head" x="400" y="34" text-anchor="middle">The robot</text>
  <rect class="box" x="60"  y="52" width="160" height="64"/>
  <text class="label" x="140" y="80" text-anchor="middle">Sense</text>
  <text class="small" x="140" y="100" text-anchor="middle">microphones, cameras</text>

  <rect class="box" x="320" y="52" width="160" height="64"/>
  <text class="label" x="400" y="80" text-anchor="middle">Decide</text>
  <text class="small" x="400" y="100" text-anchor="middle">listen, segment, choose</text>

  <rect class="box" x="580" y="52" width="160" height="64"/>
  <text class="label" x="660" y="80" text-anchor="middle">Act</text>
  <text class="small" x="660" y="100" text-anchor="middle">motors and solenoids</text>

  <path class="arrow" d="M 220 84 L 320 84"/>
  <path class="arrow" d="M 480 84 L 580 84"/>

  <rect class="human" x="300" y="250" width="200" height="70"/>
  <text class="label" x="400" y="278" text-anchor="middle">Human player</text>
  <text class="small" x="400" y="300" text-anchor="middle">in the same room</text>

  <path class="sound" d="M 660 116 L 660 285 L 500 285"/>
  <text class="small" x="672" y="200" fill="#e8556d">sound in the air</text>
  <path class="arrow" d="M 300 285 L 140 285 L 140 116"/>
  <text class="small" x="128" y="200" text-anchor="end">playing, moving</text>

  <text class="small" x="400" y="360" text-anchor="middle">The loop closes through the room, so latency and the physics of the body set its pace.</text>
</svg>

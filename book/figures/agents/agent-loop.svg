<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="The three parts of an agent: a model with tools, a loop, and a stopping criterion, with every step written to a trace">
  <style>
    .box { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 12; ry: 12; }
    .core { fill: #5a2a7a; stroke: #5a2a7a; rx: 14; ry: 14; }
    .out { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 12; ry: 12; }
    .trace { fill: #fbfaff; stroke: #cfc7dd; stroke-width: 1.5; rx: 12; ry: 12; }
    .label { font: 600 14px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .core-label { font: 700 15px Helvetica, Arial, sans-serif; fill: #fff; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .arrow { fill: none; stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
    .thin { fill: none; stroke: #8a8598; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#a3); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8598"/>
    </marker>
  </defs>

  <rect class="box" x="30" y="120" width="120" height="56"/>
  <text class="label" x="90" y="154" text-anchor="middle">A goal</text>

  <rect class="core" x="200" y="110" width="180" height="76"/>
  <text class="core-label" x="290" y="142" text-anchor="middle">Model</text>
  <text class="small" x="290" y="164" text-anchor="middle" style="fill:#e6dff0">plans the next step</text>

  <rect class="box" x="440" y="110" width="180" height="76"/>
  <text class="label" x="530" y="142" text-anchor="middle">Tool</text>
  <text class="small" x="530" y="164" text-anchor="middle">search, code, files, browser</text>

  <rect class="out" x="660" y="120" width="110" height="56"/>
  <text class="label" x="715" y="146" text-anchor="middle">Stop</text>
  <text class="small" x="715" y="164" text-anchor="middle">goal or budget</text>

  <path class="arrow" d="M 150 148 L 200 148"/>
  <path class="arrow" d="M 380 132 L 440 132"/>
  <text class="small" x="410" y="122" text-anchor="middle">call</text>
  <path class="arrow" d="M 440 164 L 380 164"/>
  <text class="small" x="410" y="184" text-anchor="middle">result</text>
  <path class="arrow" d="M 620 148 L 660 148"/>

  <rect class="trace" x="200" y="238" width="420" height="56"/>
  <text class="head" x="410" y="264" text-anchor="middle">The trace</text>
  <text class="small" x="410" y="284" text-anchor="middle">every decision, every call, and everything that came back</text>
  <path class="thin" d="M 290 186 L 290 238"/>
  <path class="thin" d="M 530 186 L 530 238"/>
  <text class="small" x="410" y="322" text-anchor="middle">The trace is what you supervise, because the mistake is usually three steps before the failure.</text>
</svg>

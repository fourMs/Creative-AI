<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Three kinds of 3D AI: capture from photographs, generation from a prompt, and texture generation for existing geometry">
  <style>
    .col { fill: #fbfaff; stroke: #cfc7dd; stroke-width: 1.5; rx: 14; ry: 14; }
    .box { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 10; ry: 10; }
    .out { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 10; ry: 10; }
    .label { font: 600 13px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 14px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .arrow { fill: none; stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
  
    @media (prefers-color-scheme: dark) {
      .bg { fill: #e7e5e4; }
      .arrow { stroke: #e7e5e4; }
      .col { stroke: #a8a29e; }
      .mk { fill: #e7e5e4; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mk" d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
  </defs>

  <rect class="col" x="20"  y="20" width="240" height="250"/>
  <text class="head" x="140" y="46" text-anchor="middle">Capture</text>
  <rect class="box" x="50"  y="62" width="180" height="42"/>
  <text class="label" x="140" y="88" text-anchor="middle">photographs of a place</text>
  <path class="arrow" d="M 140 104 L 140 132"/>
  <rect class="box" x="50"  y="134" width="180" height="42"/>
  <text class="label" x="140" y="160" text-anchor="middle">optimise against them</text>
  <path class="arrow" d="M 140 176 L 140 204"/>
  <rect class="out" x="50"  y="206" width="180" height="42"/>
  <text class="label" x="140" y="232" text-anchor="middle">new views</text>
  <text class="small bg" x="140" y="290" text-anchor="middle">answerable to the real place</text>

  <rect class="col" x="280" y="20" width="240" height="250"/>
  <text class="head" x="400" y="46" text-anchor="middle">Generation</text>
  <rect class="box" x="310" y="62" width="180" height="42"/>
  <text class="label" x="400" y="88" text-anchor="middle">a sentence or a picture</text>
  <path class="arrow" d="M 400 104 L 400 132"/>
  <rect class="box" x="310" y="134" width="180" height="42"/>
  <text class="label" x="400" y="153" text-anchor="middle">agreeing views, then</text>
  <text class="label" x="400" y="169" text-anchor="middle">geometry</text>
  <path class="arrow" d="M 400 176 L 400 204"/>
  <rect class="out" x="310" y="206" width="180" height="42"/>
  <text class="label" x="400" y="232" text-anchor="middle">an object, usually a prop</text>
  <text class="small bg" x="400" y="290" text-anchor="middle">nothing behind it to be wrong about</text>

  <rect class="col" x="540" y="20" width="240" height="250"/>
  <text class="head" x="660" y="46" text-anchor="middle">Texture</text>
  <rect class="box" x="570" y="62" width="180" height="42"/>
  <text class="label" x="660" y="88" text-anchor="middle">geometry you already have</text>
  <path class="arrow" d="M 660 104 L 660 132"/>
  <rect class="box" x="570" y="134" width="180" height="42"/>
  <text class="label" x="660" y="160" text-anchor="middle">generate the surface</text>
  <path class="arrow" d="M 660 176 L 660 204"/>
  <rect class="out" x="570" y="206" width="180" height="42"/>
  <text class="label" x="660" y="232" text-anchor="middle">colour and material maps</text>
  <text class="small bg" x="660" y="290" text-anchor="middle">slots into an existing pipeline</text>
</svg>

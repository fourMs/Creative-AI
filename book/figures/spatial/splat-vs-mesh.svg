<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="A cloud of splats that renders from any angle but has no surface, next to a mesh of triangles that has one, with a lossy conversion arrow between them">
  <style>
    .panel { fill: #fbfaff; stroke: #cfc7dd; stroke-width: 1.5; rx: 14; ry: 14; }
    .splat { fill: #5a2a7a; opacity: 0.45; }
    .mesh { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 1.5; }
    .label { font: 600 14px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .arrow { fill: none; stroke: #e8556d; stroke-width: 2; marker-end: url(#a2); }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8556d"/>
    </marker>
  </defs>

  <rect class="panel" x="20" y="20" width="330" height="220"/>
  <text class="head" x="185" y="48" text-anchor="middle">A splat: a rendering</text>
  <g>
    <ellipse class="splat" cx="120" cy="140" rx="26" ry="14" transform="rotate(-18 120 140)"/>
    <ellipse class="splat" cx="160" cy="120" rx="30" ry="12" transform="rotate(12 160 120)"/>
    <ellipse class="splat" cx="200" cy="146" rx="22" ry="16" transform="rotate(-30 200 146)"/>
    <ellipse class="splat" cx="150" cy="168" rx="34" ry="12" transform="rotate(6 150 168)"/>
    <ellipse class="splat" cx="235" cy="118" rx="26" ry="13" transform="rotate(24 235 118)"/>
    <ellipse class="splat" cx="245" cy="164" rx="20" ry="15" transform="rotate(-8 245 164)"/>
    <ellipse class="splat" cx="188" cy="98"  rx="24" ry="11" transform="rotate(-14 188 98)"/>
  </g>
  <text class="small" x="185" y="212" text-anchor="middle">looks right from any angle,</text>
  <text class="small" x="185" y="230" text-anchor="middle">and there is no surface in it</text>

  <rect class="panel" x="450" y="20" width="330" height="220"/>
  <text class="head" x="615" y="48" text-anchor="middle">A mesh: geometry</text>
  <g>
    <polygon class="mesh" points="530,170 580,100 620,170"/>
    <polygon class="mesh" points="580,100 660,110 620,170"/>
    <polygon class="mesh" points="620,170 660,110 700,168"/>
    <polygon class="mesh" points="530,170 620,170 570,214"/>
    <polygon class="mesh" points="620,170 700,168 650,214"/>
    <polygon class="mesh" points="570,214 620,170 650,214"/>
  </g>
  <text class="small" x="615" y="234" text-anchor="middle">a surface to collide with, cut, and deform</text>

  <path class="arrow" d="M 350 130 L 450 130"/>
  <text class="small" x="400" y="120" text-anchor="middle" fill="#e8556d">lossy</text>
  <text class="small" x="400" y="278" text-anchor="middle">If the destination is a viewer, a splat is excellent. If it is a game engine, budget for the conversion.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Three strategies for the time axis, each with the failure it produces">
  <style>
    .frame { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; }
    .key { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; }
    .fill { fill: #ffffff; stroke: #b9b4c4; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .block { fill: none; stroke: #e8556d; stroke-width: 2; stroke-dasharray: 6 4; rx: 8; ry: 8; }
    .label { font: 700 14px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .arrow { fill: none; stroke: #1f2545; stroke-width: 1.5; marker-end: url(#a); }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
  </defs>

  <text class="head" x="40" y="30">Three ways to handle the time axis, and what each one gets wrong</text>

  <text class="label" x="40" y="66">Frame by frame, with attention across frames</text>
  <g>
    <rect class="frame" x="40"  y="78" width="52" height="38"/>
    <rect class="frame" x="112" y="78" width="52" height="38"/>
    <rect class="frame" x="184" y="78" width="52" height="38"/>
    <rect class="frame" x="256" y="78" width="52" height="38"/>
    <rect class="frame" x="328" y="78" width="52" height="38"/>
  </g>
  <path class="arrow" d="M 92 97 L 112 97"/>
  <path class="arrow" d="M 164 97 L 184 97"/>
  <path class="arrow" d="M 236 97 L 256 97"/>
  <path class="arrow" d="M 308 97 L 328 97"/>
  <text class="small" x="420" y="102">cheap, and it drifts in the direction of travel</text>

  <text class="label" x="40" y="158">Space-time diffusion</text>
  <g>
    <rect class="frame" x="40"  y="170" width="52" height="38"/>
    <rect class="frame" x="112" y="170" width="52" height="38"/>
    <rect class="frame" x="184" y="170" width="52" height="38"/>
    <rect class="frame" x="256" y="170" width="52" height="38"/>
    <rect class="frame" x="328" y="170" width="52" height="38"/>
  </g>
  <rect class="block" x="30" y="166" width="360" height="52"/>
  <text class="small" x="420" y="194">consistent throughout, and the clip length is capped hard</text>

  <text class="label" x="40" y="250">Keyframes, then interpolation</text>
  <g>
    <rect class="key"  x="40"  y="262" width="52" height="38"/>
    <rect class="fill" x="112" y="262" width="52" height="38"/>
    <rect class="fill" x="184" y="262" width="52" height="38"/>
    <rect class="key"  x="256" y="262" width="52" height="38"/>
    <rect class="fill" x="328" y="262" width="52" height="38"/>
  </g>
  <text class="small" x="420" y="286">long and cheap, and the motion between the keyframes slides</text>
</svg>

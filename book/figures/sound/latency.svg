<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="A latency scale from one millisecond to a minute, with playing at the fast end and prompting at the slow end">
  <style>
    .scale { fill: none; stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
    .tick { stroke: #1f2545; stroke-width: 2; }
    .band { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 10; ry: 10; }
    .band-out { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 10; ry: 10; }
    .label { font: 600 14px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
  </defs>

  <text class="head" x="40" y="34">The delay between an action and the sound it causes</text>

  <rect class="band" x="40" y="56" width="230" height="52"/>
  <text class="label" x="155" y="80" text-anchor="middle">Playing</text>
  <text class="small" x="155" y="98" text-anchor="middle">a small model on a laptop</text>

  <rect class="band-out" x="470" y="56" width="290" height="52"/>
  <text class="label" x="615" y="80" text-anchor="middle">Prompting</text>
  <text class="small" x="615" y="98" text-anchor="middle">a text-to-song service</text>

  <line class="scale" x1="40" y1="150" x2="770" y2="150"/>
  <line class="tick" x1="80"  y1="142" x2="80"  y2="158"/>
  <line class="tick" x1="230" y1="142" x2="230" y2="158"/>
  <line class="tick" x1="380" y1="142" x2="380" y2="158"/>
  <line class="tick" x1="530" y1="142" x2="530" y2="158"/>
  <line class="tick" x1="680" y1="142" x2="680" y2="158"/>
  <text class="small" x="80"  y="178" text-anchor="middle">1 ms</text>
  <text class="small" x="230" y="178" text-anchor="middle">10 ms</text>
  <text class="small" x="380" y="178" text-anchor="middle">100 ms</text>
  <text class="small" x="530" y="178" text-anchor="middle">1 s</text>
  <text class="small" x="680" y="178" text-anchor="middle">10 s</text>

  <text class="small" x="230" y="212" text-anchor="middle">the sound still feels caused by the gesture</text>
  <text class="small" x="600" y="212" text-anchor="middle">the sound is a reply to it, and the work becomes composing</text>
</svg>

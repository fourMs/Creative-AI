<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Four assistant patterns ordered by how much unreviewed code each one adds per interaction">
  <style>
    .box { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 10; ry: 10; }
    .hot { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 10; ry: 10; }
    .bar { fill: #5a2a7a; }
    .bar-hi { fill: #e8556d; }
    .label { font: 600 14px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .axis { stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
  
    @media (prefers-color-scheme: dark) {
      .bg { fill: #e7e5e4; }
      .bg.head { fill: #d8b4fe; }
      .axis { stroke: #e7e5e4; }
      .mk { fill: #e7e5e4; }
      .bar { fill: #a855f7; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mk" d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
  </defs>

  <text class="head bg" x="40" y="34">Four patterns, ordered by the code they add before anybody reads it</text>

  <rect class="box" x="40" y="56" width="190" height="40"/>
  <text class="label" x="135" y="81" text-anchor="middle">Tab completion</text>
  <rect class="bar" x="250" y="66" width="30" height="20"/>
  <text class="small bg" x="292" y="81">a line</text>

  <rect class="box" x="40" y="112" width="190" height="40"/>
  <text class="label" x="135" y="137" text-anchor="middle">Inline edit</text>
  <rect class="bar" x="250" y="122" width="90" height="20"/>
  <text class="small bg" x="352" y="137">a paragraph</text>

  <rect class="box" x="40" y="168" width="190" height="40"/>
  <text class="label" x="135" y="193" text-anchor="middle">Chat in the editor</text>
  <rect class="bar" x="250" y="178" width="170" height="20"/>
  <text class="small bg" x="432" y="193">whatever you paste in</text>

  <rect class="hot" x="40" y="224" width="190" height="40"/>
  <text class="label" x="135" y="249" text-anchor="middle">Agentic</text>
  <rect class="bar-hi" x="250" y="234" width="320" height="20"/>
  <text class="small bg" x="582" y="249">several files</text>

  <line class="axis" x1="250" y1="286" x2="600" y2="286"/>
  <text class="small bg" x="250" y="308">your ability to supervise does not grow along this axis</text>
</svg>

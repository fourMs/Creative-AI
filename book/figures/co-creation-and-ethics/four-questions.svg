<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Four ethical questions asked of one specific system and use">
  <style>
    .box { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 12; ry: 12; }
    .core { fill: #5a2a7a; stroke: #5a2a7a; rx: 14; ry: 14; }
    .out { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 12; ry: 12; }
    .label { font: 600 14px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .core-label { font: 700 15px Helvetica, Arial, sans-serif; fill: #fff; }
    .small { font: 500 12px Helvetica, Arial, sans-serif; fill: #444; }
    .num { font: 700 13px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .arrow { fill: none; stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
  
    @media (prefers-color-scheme: dark) {
      .arrow { stroke: #e7e5e4; }
      .mk { fill: #e7e5e4; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mk" d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
  </defs>

  <rect class="core" x="300" y="120" width="200" height="66"/>
  <text class="core-label" x="400" y="148" text-anchor="middle">One system,</text>
  <text class="core-label" x="400" y="168" text-anchor="middle">one use</text>

  <rect class="box" x="40"  y="40" width="200" height="56"/>
  <text class="num" x="56" y="64">1</text>
  <text class="label" x="140" y="64" text-anchor="middle">Who benefits?</text>
  <text class="small" x="140" y="84" text-anchor="middle">users, company, society</text>

  <rect class="box" x="560" y="40" width="200" height="56"/>
  <text class="num" x="576" y="64">2</text>
  <text class="label" x="660" y="64" text-anchor="middle">Who is harmed?</text>
  <text class="small" x="660" y="84" text-anchor="middle">workers, bystanders, planet</text>

  <rect class="box" x="40"  y="210" width="200" height="56"/>
  <text class="num" x="56" y="234">3</text>
  <text class="label" x="140" y="234" text-anchor="middle">Is it proportional?</text>
  <text class="small" x="140" y="254" text-anchor="middle">benefit weighed against harm</text>

  <rect class="out" x="560" y="210" width="200" height="56"/>
  <text class="num" x="576" y="234">4</text>
  <text class="label" x="660" y="234" text-anchor="middle">Was it consented to?</text>
  <text class="small" x="660" y="254" text-anchor="middle">by those bearing the harm</text>

  <path class="arrow" d="M 240 78 L 320 120"/>
  <path class="arrow" d="M 560 78 L 480 120"/>
  <path class="arrow" d="M 240 228 L 320 186"/>
  <path class="arrow" d="M 560 228 L 480 186"/>
</svg>

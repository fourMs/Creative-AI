<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="An executor transaction compared with a collaborative loop">
  <style>
    .box { fill: #f4f1fa; stroke: #5a2a7a; stroke-width: 2; rx: 12; ry: 12; }
    .out { fill: #fff0f3; stroke: #e8556d; stroke-width: 2; rx: 12; ry: 12; }
    .label { font: 600 15px Helvetica, Arial, sans-serif; fill: #1f2545; }
    .small { font: 500 13px Helvetica, Arial, sans-serif; fill: #444; }
    .head { font: 700 15px Helvetica, Arial, sans-serif; fill: #5a2a7a; }
    .arrow { fill: none; stroke: #1f2545; stroke-width: 2; marker-end: url(#a); }
    .back { fill: none; stroke: #e8556d; stroke-width: 2; marker-end: url(#a2); }
    .rule { stroke: #cfc7dd; stroke-width: 1; }
  
    .accent { fill: #e8556d; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #e7e5e4; }
      .bg.head { fill: #d8b4fe; }
      .arrow { stroke: #e7e5e4; }
      .rule { stroke: #a8a29e; }
      .mk { fill: #e7e5e4; }
      .accent { fill: #ff8fa3; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mk" d="M 0 0 L 10 5 L 0 10 z" fill="#1f2545"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8556d"/>
    </marker>
  </defs>

  <text class="head bg" x="40" y="34">The executor: one command, one output, transaction complete</text>
  <rect class="box" x="40"  y="52" width="170" height="58"/>
  <text class="label" x="125" y="87" text-anchor="middle">Command</text>
  <rect class="box" x="290" y="52" width="170" height="58"/>
  <text class="label" x="375" y="87" text-anchor="middle">Model</text>
  <rect class="out" x="540" y="52" width="170" height="58"/>
  <text class="label" x="625" y="87" text-anchor="middle">Output</text>
  <path class="arrow" d="M 210 81 L 290 81"/>
  <path class="arrow" d="M 460 81 L 540 81"/>

  <line class="rule" x1="40" y1="142" x2="760" y2="142"/>

  <text class="head bg" x="40" y="180">The collaborator: a loop the person keeps steering</text>
  <rect class="box" x="40"  y="200" width="150" height="58"/>
  <text class="label" x="115" y="235" text-anchor="middle">Brief</text>
  <rect class="box" x="230" y="200" width="150" height="58"/>
  <text class="label" x="305" y="228" text-anchor="middle">Variations</text>
  <text class="small" x="305" y="248" text-anchor="middle">at least three</text>
  <rect class="box" x="420" y="200" width="150" height="58"/>
  <text class="label" x="495" y="228" text-anchor="middle">Selection</text>
  <text class="small" x="495" y="248" text-anchor="middle">and veto</text>
  <rect class="out" x="610" y="200" width="150" height="58"/>
  <text class="label" x="685" y="228" text-anchor="middle">Edit</text>
  <text class="small" x="685" y="248" text-anchor="middle">and context</text>
  <path class="arrow" d="M 190 229 L 230 229"/>
  <path class="arrow" d="M 380 229 L 420 229"/>
  <path class="arrow" d="M 570 229 L 610 229"/>
  <path class="back" d="M 685 258 L 685 310 L 115 310 L 115 258"/>
  <text class="small accent" x="400" y="332" text-anchor="middle">what the output revealed goes back into the brief</text>
</svg>
